name: Port checks
on: [push, pull_request]
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git -c core.autocrlf=false submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/verify_upstream.py
      - run: python scripts/generate_engine_resources.py --check
      - run: python scripts/port_xaml.py --check
      - run: cargo fmt --check
      - run: cargo test --locked --no-default-features
  ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git -c core.autocrlf=false submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --features headless --test ui -- --test-threads=1
        env:
          FERRO_CALC_CAPTURE_DIR: artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-renders
          path: artifacts
