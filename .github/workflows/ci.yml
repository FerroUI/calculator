name: CI

# Build, tests, the browser site and its GitHub Pages deployment, with the shared workflow of
# FerroUI (FerroUI/docs/apps.md). The checkout includes both submodules: FerroUI and the original
# Microsoft Calculator sources, whose engine build.rs compiles.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    uses: wieslawsoltes/FerroUI/.github/workflows/app.yml@main
    with:
      # The original engine through the bridge, and the date calculations, without the UI; then
      # every ported view and the Reveal borders of neighbouring keys on the headless platform with
      # the real XAML loader and Skia (each scenario file in a process of its own).
      test: |
        -p ferro-calculator --no-default-features
        -p ferro-calculator --features headless --test ui --test reveal_gap -- --test-threads=1
      check: |
        -p ferro-calculator --bins
      # The original sources byte for byte against the manifest, and the generated engine
      # resources and keypad XAML against what the scripts produce from them.
      script: |
        python3 scripts/verify_upstream.py
        python3 scripts/generate_engine_resources.py --check
        python3 scripts/port_xaml.py --check
        rustup component add rustfmt
        cargo fmt --check
      browser-package: ferro-calculator-browser
